[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-tag"
version = "0.1.0"
description = "Auto-tag images with Vertex AI Gemini. Custom YAML schema, CSV export, optional Label Studio review."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "VisionTag contributors" }]
keywords = [
  "vertex-ai",
  "gemini",
  "image-labeling",
  "label-studio",
  "computer-vision",
  "auto-annotation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-cloud-aiplatform>=1.71.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
label-studio = [
  "label-studio>=1.13.0",
  "requests>=2.32.0",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
visiontag = "vision_tag.cli:main"

[project.urls]
Homepage = "https://github.com/21benniel/vision-tag"
Documentation = "https://github.com/21benniel/vision-tag#readme"
Repository = "https://github.com/21benniel/vision-tag"

[tool.setuptools.packages.find]
where = ["."]
include = ["vision_tag*"]

[tool.setuptools.package-data]
vision_tag = ["../config/*.yaml"]
